# 在 GitHub 的機器上開 Android 模擬器，裝 App、點過各畫面並截圖，
# 截圖存回同一個分支的 screenshots/ 資料夾（main 分支只上傳成 artifact）。
# repo 設了 FUGLE_API_KEY secret 才會拍到有報價和 K 線的畫面。
name: 模擬器截圖

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths-ignore: ['screenshots/**', '**.md']

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: 編譯 debug APK
        run: ./gradlew assembleDebug

      - name: 啟用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 開模擬器並截圖
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/screenshots.py app/build/outputs/apk/debug/app-debug.apk screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: 截圖存回分支
        if: github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "截圖沒有變化"
            exit 0
          fi
          git commit -m "更新模擬器截圖"
          # 跑的期間分支若有新 commit，接在最新的後面再推
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
